server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri /index.html; }
  # Put the API behind the same protected origin in deployment.
  location /api/ { proxy_pass http://arkflow-hub:8080; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
  location /metrics { proxy_pass http://arkflow-hub:8080/metrics; proxy_set_header Host $host; }
}
