[workspace.package]
version = "0.5.0"
edition = "2021"
description = "High-performance Rust flow processing engine"
authors = ["chenquan <chenquan.dev@gmail.com>"]
repository = "https://github.com/arkflow-rs/arkflow"
homepage = "https://github.com/arkflow-rs/arkflow"
license = "Apache-2.0"
rust-version = "1.97"

[workspace]
members = [
    "crates/arkflow-plugin",
    "crates/arkflow-core",
    "crates/arkflow-server",
    "crates/arkflow",
]

resolver = "2"

[workspace.dependencies]
rustls-native-certs = "0.8"
rustls-pemfile = "2"
tokio-rustls = "0.26"
rustls = "0.23"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.18"
async-trait = "0.1"
futures = "0.3"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
indexmap = "2"
rustc-hash = "2"
humantime = "2.3.0"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["std", "fmt", "json"] }
prometheus = "0.14"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
apache-avro = { version = "0.22", default-features = false }
datafusion = { version = "54.1", features = ["avro"] }
datafusion-functions-json = "0.54.2"
arrow-json = "58.4"
arrow-pyarrow = "58.4"
prost-reflect = "0.16.3"
prost-types = "0.14.3"
# Pure-Rust .proto compiler from the prost-reflect author; output feeds
# prost-reflect directly (replaces the old rust-protobuf parser + byte bridge).
protox = "0.9.1"
toml = "0.9"
lazy_static = "1.4"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["cors", "trace", "limit"] }
# rust_crypto keeps the ring backend from v9 (arkflow-core's TLS stack also
# uses ring); v10+ cannot auto-pick a provider when none/both features are set.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
opentelemetry = "0.33"
opentelemetry-otlp = { version = "0.33", features = ["http-json", "reqwest-client"] }
opentelemetry_sdk = "0.33"
tracing-opentelemetry = "0.34"
reqwest = { version = "0.13", features = ["json", "query"] }
percent-encoding = "2.3"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
flume = "=0.11"
subtle = "2.6"
hmac = "0.12"
base64 = "0.22"
sha2 = "0.10"
rand = "0.9"
dashmap = "6.1"
mongodb = { version = "3.2", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }

# Sql
sqlx = { version = "0.9", default-features = false, features = ["mysql", "postgres", "runtime-tokio", "tls-native-tls"] }
rusqlite = "0.37"

tempfile = "3.24.0"
mockall = "0.14"
redb = "4"
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }
bytes = "1"
arkflow-core = { path = "crates/arkflow-core" }
arkflow-plugin = { path = "crates/arkflow-plugin" }
arkflow-server = { path = "crates/arkflow-server" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
