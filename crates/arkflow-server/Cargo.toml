[package]
name = "arkflow-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true

[dependencies]
jsonwebtoken = { workspace = true }
arkflow-core = { workspace = true }
arkflow-plugin = { workspace = true, default-features = false }
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
futures-util = { workspace = true }
flume = { workspace = true }
reqwest = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
rustls-pemfile = { workspace = true }
x509-parser = { workspace = true }
tracing = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
url = "2.5.8"
tokio = { workspace = true }
tokio-util = { workspace = true }
tower-http = { workspace = true }
sqlx = { workspace = true }
rusqlite = { workspace = true }
object_store = { workspace = true }
bytes = { workspace = true }
prometheus = { workspace = true }
sysinfo = { workspace = true }
async-trait = { workspace = true }

# Feature gating: mirrors arkflow-plugin's family features (forwarded 1:1).
# Default enables THIS crate's mirror features so cfg!(feature = ...) inside
# arkflow-server reflects the real feature set.
[features]
default = [
    "connectors-sql",
    "connectors-kafka",
    "connectors-python",
    "connectors-mongodb",
    "connectors-pulsar",
    "connectors-hdfs",
    "connectors-mqtt",
    "connectors-nats",
    "connectors-amqp09",
    "connectors-redis",
    "connectors-websocket",
    "connectors-modbus",
    "ai-vector",
    "processors-vrl",
    "codecs-protobuf",
]
connectors-sql = ["arkflow-plugin/connectors-sql"]
connectors-kafka = ["arkflow-plugin/connectors-kafka"]
connectors-python = ["arkflow-plugin/connectors-python"]
connectors-mongodb = ["arkflow-plugin/connectors-mongodb"]
connectors-pulsar = ["arkflow-plugin/connectors-pulsar"]
connectors-hdfs = ["arkflow-plugin/connectors-hdfs"]
connectors-mqtt = ["arkflow-plugin/connectors-mqtt"]
connectors-nats = ["arkflow-plugin/connectors-nats"]
connectors-amqp09 = ["arkflow-plugin/connectors-amqp09"]
connectors-redis = ["arkflow-plugin/connectors-redis"]
connectors-websocket = ["arkflow-plugin/connectors-websocket"]
connectors-modbus = ["arkflow-plugin/connectors-modbus"]
ai-vector = ["arkflow-plugin/ai-vector"]
processors-vrl = ["arkflow-plugin/processors-vrl"]
codecs-protobuf = ["arkflow-plugin/codecs-protobuf"]
engine-minimal = ["arkflow-plugin/engine-minimal"]

[dev-dependencies]
rcgen = "0.14"
tower = { workspace = true }
tempfile = { workspace = true }
datafusion = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
