[package]
name = "arkflow-plugin"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true


[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
indexmap = { workspace = true }
rustc-hash = { workspace = true }
toml = { workspace = true }
humantime = { workspace = true }
tracing = { workspace = true }
datafusion = { workspace = true }
datafusion-functions-json = { workspace = true }
datafusion-table-providers = { version = "0.13", optional = true, features = [
    "mysql",
    "postgres",
    "duckdb",
    "sqlite",
], default-features = false }
ballista = { version = "54.0", optional = true }
duckdb = { version = "1.4", package = "spiceai_duckdb_fork", optional = true }
arrow-json = { workspace = true }
arrow-pyarrow = { workspace = true, optional = true }
arrow-array = "58.4"
prost-reflect = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
apache-avro = { workspace = true }
protox = { workspace = true, optional = true }
lazy_static = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
percent-encoding = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
base64 = "0.22"
subtle = { workspace = true }
flume = { workspace = true }
dashmap = { workspace = true }
tempfile = { workspace = true }
rumqttc = { version = "0.25.1", optional = true }
rustls-native-certs = { workspace = true }
rustls-pemfile = { workspace = true }

# Kafka
rdkafka = { version = "0.39", optional = true, features = [
    "cmake-build",
    "tracing",
    "sasl",
    "ssl-vendored",
    "zstd",
] }
rdkafka-sys = { version = "4.8.0", optional = true }
sasl2-sys = { version = "0.1.22", optional = true, features = ["vendored"] }

# redis
redis = { version = "1.7", optional = true, features = ["tokio-native-tls-comp", "aio", "connection-manager", "cluster-async"] }

# vrl https://github.com/vectordotdev/vrl
vrl = { version = "0.37", optional = true, features = ["value", "compiler", "stdlib"] }



# arkflow
arkflow-core = { workspace = true }
sqlx = { workspace = true, optional = true }
mongodb = { workspace = true, optional = true }

# Websocket
tokio-tungstenite = { version = "0.30", optional = true, features = ["native-tls"] }

# NATS
async-nats = { version = "0.53", optional = true }

# Pulsar
pulsar = { version = "6.6", optional = true }
rand = { workspace = true }


# modbus
tokio-modbus = { version = "0.17", optional = true, default-features = false, features = ["tcp"] }

# Object Store
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }
bytes = "1"
hdfs-native-object-store = { version = "0.16", optional = true }

# Compression (WAL segment optimization)
zstd = "0.13"
lz4_flex = "0.13"

# python
pyo3 = { version = "0.28", optional = true, features = ["auto-initialize", "serde"] }

once_cell = "1.19.0"
futures = { workspace = true }
tokio-stream = "0.1.18"
url = "2.5.8"
num_cpus = "1.17.0"

# Feature gating: default enables every family so a default build registers
# exactly the same components as an ungated build. Use
# `--no-default-features --features engine-minimal` for a minimal build
# (core engine + light components only); add family features to extend it.
[features]
default = [
    "connectors-sql",
    "connectors-kafka",
    "connectors-python",
    "connectors-mongodb",
    "connectors-pulsar",
    "connectors-hdfs",
    "connectors-mqtt",
    "connectors-nats",
    "connectors-redis",
    "connectors-websocket",
    "connectors-modbus",
    "ai-vector",
    "processors-vrl",
    "codecs-protobuf",
]
# SQL input/output family: duckdb fork + ballista + datafusion-table-providers + sqlx
connectors-sql = ["dep:datafusion-table-providers", "dep:ballista", "dep:duckdb", "dep:sqlx"]
# Kafka connectors: vendored rdkafka with SASL
connectors-kafka = ["dep:rdkafka", "dep:rdkafka-sys", "dep:sasl2-sys"]
# Python UDF processor: PyO3 + arrow bridge
connectors-python = ["dep:pyo3", "dep:arrow-pyarrow"]
# MongoDB output
connectors-mongodb = ["dep:mongodb"]
# Pulsar input/output
connectors-pulsar = ["dep:pulsar"]
# hdfs scheme of the file input
connectors-hdfs = ["dep:hdfs-native-object-store"]
# MQTT input/output
connectors-mqtt = ["dep:rumqttc"]
# NATS input/output
connectors-nats = ["dep:async-nats"]
# Redis input/output/temporary
connectors-redis = ["dep:redis"]
# WebSocket input
connectors-websocket = ["dep:tokio-tungstenite"]
# Modbus input
connectors-modbus = ["dep:tokio-modbus"]
# AI/vector processors (embedding/llm/vector_search/milvus_search/pgvector_search)
# and vector outputs (qdrant/milvus/pgvector); shares sqlx via pgvector
ai-vector = ["dep:sqlx"]
# VRL processor
processors-vrl = ["dep:vrl"]
# Protobuf & schema_registry codecs + arrow<->protobuf processors
codecs-protobuf = ["dep:prost-reflect", "dep:prost-types", "dep:protox"]
# Minimal build meta-feature: core engine + light components only.
# Only meaningful together with --no-default-features (features are additive).
engine-minimal = []

[dev-dependencies]
# tokio's "full" does not include "test-util"; the default build got it
# transitively from a gated connector dependency, so reduced test builds
# (`#[tokio::test(start_paused = true)]` in generate.rs) need it explicitly.
tokio = { workspace = true, features = ["test-util"] }
mockall = { workspace = true }
serial_test = "4.0.1"
testcontainers = "0.28.0"
wiremock = "0.6"

[lints]
workspace = true
