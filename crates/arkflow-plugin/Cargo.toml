[package]
name = "arkflow-plugin"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true


[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }
futures-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
humantime = { workspace = true }
tracing = { workspace = true }
datafusion = { workspace = true }
datafusion-functions-json = { workspace = true }
datafusion-table-providers = { version = "0.13", features = [
    "mysql",
    "postgres",
    "duckdb",
    "sqlite",
], default-features = false }
ballista = { version = "54.0" }
duckdb = { version = "1.4", package = "spiceai_duckdb_fork" }
arrow-json = { workspace = true }
arrow-pyarrow = { workspace = true }
arrow-array = "58.4"
prost-reflect = { workspace = true }
prost-types = { workspace = true }
protobuf-parse = { workspace = true }
protobuf = { workspace = true }
lazy_static = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
base64 = "0.22"
subtle = { workspace = true }
governor = { workspace = true, features = ["std"] }
colored = { workspace = true }
flume = { workspace = true }
dashmap = { workspace = true }
tempfile = { workspace = true }
rumqttc = "0.25.1"

# Kafka
aws-msk-iam-sasl-signer = "1.0.0"
rdkafka = { version = "0.38", features = [
    "cmake-build",
    "tracing",
    "sasl",
    "ssl-vendored",
    "zstd",
] }
rdkafka-sys = "4.8.0"
sasl2-sys = { version = "0.1.22", features = ["vendored"] }

# redis
redis = { version = "0.32", features = ["tokio-native-tls-comp", "aio", "connection-manager", "cluster-async"] }

# vrl https://github.com/vectordotdev/vrl
vrl = { version = "0.30", features = ["value", "compiler", "stdlib"] }



# arkflow
arkflow-core = { workspace = true }
sqlx = { workspace = true }
mongodb = { workspace = true }

# Websocket
tokio-tungstenite = { version = "0.28", features = ["native-tls"] }

# NATS
async-nats = "0.46"

# Pulsar
pulsar = "6.6"
rand = "0.10"


# modbus
tokio-modbus = { version = "0.17", default-features = false, features = ["tcp"] }

# Object Store
object_store = { version = "0.13", features = ["aws", "azure", "gcp", "http"] }
bytes = "1"
hdfs-native-object-store = "0.17"

# Compression (WAL segment optimization)
zstd = "0.13"
lz4_flex = "0.11"

# python
pyo3 = { version = "0.28", features = ["auto-initialize", "serde"] }

once_cell = "1.19.0"
futures = { workspace = true }
tokio-stream = "0.1.18"
url = "2.5.8"
num_cpus = "1.17.0"

[dev-dependencies]
mockall = { workspace = true }
serial_test = "4.0.1"
testcontainers = "0.27.3"
wiremock = "0.6"
