[package]
name = "arkflow-core"
version.workspace = true
edition.workspace = true
description.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
license.workspace = true

[dependencies]
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }
humantime = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
datafusion = { workspace = true }
lazy_static = { workspace = true }
clap = { workspace = true }
colored = { workspace = true }
flume = { workspace = true }
axum = { workspace = true }
tower-http = { workspace = true }
subtle = { workspace = true }
redb = { workspace = true }
num_cpus = "1.17.0"

[dev-dependencies]
# Only `#[tokio::test(start_paused = true)]` needs the paused clock; keeping the
# feature out of the workspace dependency keeps it out of production builds.
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "state_backend_benchmark"
path = "examples/state_backend_benchmark.rs"
