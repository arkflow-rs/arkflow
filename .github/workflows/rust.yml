# Faster Rust CI: Swatinem/rust-cache keeps a deps-only target cache that
# fits the 10GB repo cache quota, debuginfo/incremental stay off to keep
# artifacts small, and nextest runs the suite.
name: Rust (fast CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A superseded push to the same branch/PR cancels the older run instead of
# burning 30+ minutes of runner time nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  # CI never reuses incremental artifacts, and they dominated the old ~14GB
  # target cache: it blew the 10GB repo cache quota, got evicted between
  # runs, and every run paid a 27-minute cold rebuild plus a 4-minute save.
  CARGO_INCREMENTAL: 0
  # Full debuginfo is dead weight in CI; line tables keep backtrace line
  # numbers while cutting compile/link time and cache size roughly in half.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  build-and-test:
    name: Build and Test (fast)
    runs-on: ubuntu-latest
    # Keep PR builds fast by default (debug). Add a separate release job for pushes/tags if needed.
    strategy:
      matrix:
        profile: [ debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace's debug build (--all-targets) plus the restored target
      # cache overflow the runner's ~20GB of free disk: drop the preinstalled
      # toolchains we do not use (Android SDK, .NET, Haskell, CodeQL, ...)
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Replaces the previous actions/cache pair: rust-cache keys on the
      # rustc version + Cargo.lock, caches the cargo home alongside target/,
      # and strips the workspace's own crates before saving, so the entry
      # stays a few GB instead of ~14GB and survives the repo cache quota.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Set PROTOC Environment Variable
        run: echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      # The python processor tests round-trip MessageBatch through the
      # embedded CPython interpreter via arrow-pyarrow, which needs the
      # `pyarrow` package in the interpreter pyo3 links against (the
      # system python3). Newer Ubuntu images mark it externally managed
      # (PEP 668), hence the --break-system-packages fallback.
      - name: Install pyarrow for python UDF tests
        run: |
          python3 -m pip install pyarrow || python3 -m pip install --break-system-packages pyarrow

      - name: Build (debug)
        run: cargo build --workspace --all-targets --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest runs each test in its own process: better cross-binary
      # parallelism than cargo test's in-process threads and clearer
      # failure isolation. Two constraints shape the suite split:
      # - Job-carrying configs open an embedded redb state store at a fixed
      #   repo-relative path, so tests validating such configs from the
      #   repository root must sandbox their working directory (see
      #   sandboxed_repo_root in docs_snippets_validate.rs) or concurrent
      #   binaries collide on the database lock.
      # - kafka_eos and pulsar_io share one testcontainers broker per binary
      #   on a fixed host port and rely on same-process serial execution;
      #   they stay on cargo test, which runs test binaries sequentially.
      - name: Run tests
        run: |
          cargo nextest run --workspace --all-targets \
            -E 'not binary(kafka_eos) and not binary(pulsar_io)'
          cargo test -p arkflow-plugin --test kafka_eos --test pulsar_io
