# Faster Rust CI: Swatinem/rust-cache keeps a deps-only target cache that
# fits the 10GB repo cache quota, debuginfo/incremental stay off to keep
# artifacts small, and nextest runs the suite.
name: Rust (fast CI)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# A superseded push to the same branch/PR cancels the older run instead of
# burning 30+ minutes of runner time nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CMAKE_POLICY_VERSION_MINIMUM: 3.5
  # sasl2-sys vendors Cyrus SASL 2.1.28, whose K&R prototypes (`MD5_memcpy()`)
  # mean "no parameters" under C23; GCC 15 on ubuntu-latest defaults to
  # -std=gnu23 and fails to compile md5.c. Pin the C dialect for the C sources
  # built by build scripts (rdkafka's SASL dependency).
  CFLAGS: "-std=gnu17"
  # CI never reuses incremental artifacts, and they dominated the old ~14GB
  # target cache: it blew the 10GB repo cache quota, got evicted between
  # runs, and every run paid a 27-minute cold rebuild plus a 4-minute save.
  CARGO_INCREMENTAL: 0
  # Full debuginfo is dead weight in CI; line tables keep backtrace line
  # numbers while cutting compile/link time and cache size roughly in half.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  fmt:
    name: Rustfmt (check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      # Formatting needs no protoc or cargo build: rustfmt parses sources
      # directly, so this job fails in well under a minute and never waits
      # behind a cold dependency build.
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy (deny warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Set PROTOC Environment Variable
        run: echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      # The toolchain line above installs clippy but running it is the gate:
      # warnings are deny-by-default so a lint regression blocks the PR the
      # same way a test failure does (this is the "lint before finishing"
      # contract from AGENTS.md, now enforced by CI instead of convention).
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  # Reduced feature-set builds (add-cargo-feature-gating). The default
  # all-families combination is covered by the clippy and build-and-test jobs
  # above, which run the full test suite — the full-inventory gate tests are
  # bound to the default feature set on purpose (they would report spurious
  # drift on a reduced build). Per-package `-p` selections are not style:
  # cargo only applies --no-default-features/-F to a single-package
  # selection, so a workspace-wide invocation would silently re-enable the
  # plugin's default families. `--all-targets` is equally deliberate: the
  # broker integration tests link gated crates directly and only exist in
  # the default build.
  feature-matrix:
    name: Feature Matrix (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "engine-minimal"
          - "engine-minimal,connectors-kafka"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install system dependencies (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Set PROTOC Environment Variable
        run: echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      - name: Check and lint (libs + bins)
        run: |
          for pkg in arkflow-plugin arkflow-server arkflow; do
            cargo check --locked -p "$pkg" --no-default-features --features "${{ matrix.features }}"
            cargo clippy --locked -p "$pkg" --no-default-features --features "${{ matrix.features }}" -- -D warnings
          done

      - name: Core engine tests
        run: cargo test --locked -p arkflow-core

      # Structural guard for the minimal build: none of the gated dependency
      # families may appear in the binary's dependency graph. rdkafka joins
      # the allowed set only when the kafka family itself is enabled.
      - name: Minimal tree excludes gated dependency families
        run: |
          FORBIDDEN='pyo3 v|spiceai_duckdb_fork|ballista|mongodb v|pulsar v|rumqttc|async-nats|lapin v|tokio-tungstenite|tokio-modbus|prost-reflect|protox|hdfs-native-object-store|vrl v|iceberg v|opendal v|reqsign'
          if [ "${{ matrix.features }}" = "engine-minimal" ]; then
            FORBIDDEN="$FORBIDDEN|rdkafka"
          fi
          if cargo tree -p arkflow --no-default-features --features "${{ matrix.features }}" | grep -E "$FORBIDDEN"; then
            echo "::error::reduced-feature build still contains gated dependencies"
            exit 1
          fi
          echo "dependency tree is clean for: ${{ matrix.features }}"

  build-and-test:
    name: Build and Test (fast)
    runs-on: ubuntu-latest
    # Keep PR builds fast by default (debug). Add a separate release job for pushes/tags if needed.
    strategy:
      matrix:
        profile: [ debug ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The workspace's debug build (--all-targets) plus the restored target
      # cache overflow the runner's ~20GB of free disk: drop the preinstalled
      # toolchains we do not use (Android SDK, .NET, Haskell, CodeQL, ...)
      # before building.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            /usr/lib/jvm
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          df -h /

      # Replaces the previous actions/cache pair: rust-cache keys on the
      # rustc version + Cargo.lock, caches the cargo home alongside target/,
      # and strips the workspace's own crates before saving, so the entry
      # stays a few GB instead of ~14GB and survives the repo cache quota.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install system dependencies (protoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libcurl4-openssl-dev

      - name: Set PROTOC Environment Variable
        run: echo "PROTOC=$(which protoc)" >> $GITHUB_ENV

      # The python processor tests round-trip MessageBatch through the
      # embedded CPython interpreter via arrow-pyarrow, which needs the
      # `pyarrow` package in the interpreter pyo3 links against (the
      # system python3). Newer Ubuntu images mark it externally managed
      # (PEP 668), hence the --break-system-packages fallback.
      - name: Install pyarrow for python UDF tests
        run: |
          python3 -m pip install pyarrow || python3 -m pip install --break-system-packages pyarrow

      - name: Build (debug)
        run: cargo build --locked --workspace --all-targets --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      # nextest runs each test in its own process: better cross-binary
      # parallelism than cargo test's in-process threads and clearer
      # failure isolation. Three constraints shape the suite split:
      # - Job-carrying configs open an embedded redb state store at a fixed
      #   repo-relative path, so tests validating such configs from the
      #   repository root must sandbox their working directory (see
      #   sandboxed_repo_root in docs_snippets_validate.rs) or concurrent
      #   binaries collide on the database lock.
      # - arkflow-plugin's broker integration suites (kafka_eos, pulsar_io,
      #   mongodb_io, nats_io, mqtt_io, ...) share one testcontainers
      #   container per binary on a fixed host port and rely on
      #   same-process serial execution, so the whole package stays on
      #   cargo test, which runs test binaries sequentially and keeps
      #   future suites of that shape working without workflow edits.
      - name: Run tests
        env:
          # CI runners provide Docker; make broker integration tests run
          # their assertions instead of returning successfully when no
          # daemon is reachable.
          ARKFLOW_REQUIRE_DOCKER: "1"
        run: |
          cargo nextest run --locked --workspace --all-targets -E 'not package(arkflow-plugin)'
          cargo test --locked -p arkflow-plugin
