{{- if and (eq .Values.mode "control-plane") .Values.controlPlane.tls.enabled (not .Values.controlPlane.tls.existingSecret) -}}
{{- $secretName := printf "%s-tls" (include "arkflow.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $caCrt := "" }}
{{- $hubCrt := "" }}
{{- $hubKey := "" }}
{{- $agentCrt := "" }}
{{- $agentKey := "" }}
{{- if $existing }}
{{- /* Reuse the existing cluster CA and certificates on upgrade so running
       Hub and Agent pods do not diverge on certificate rotation.
       Note: chart-generated leaf certs (hub.crt / agent.crt) have a 365-day
       validity and are NOT auto-renewed by `helm upgrade` while this Secret
       exists; use `controlPlane.tls.existingSecret` (e.g. cert-manager) or
       delete & recreate the Secret + restart pods before leaf expiry. */}}
{{- $caCrt = index $existing.data (default "ca.crt" .Values.controlPlane.tls.caKey) }}
{{- $hubCrt = index $existing.data (default "hub.crt" .Values.controlPlane.tls.hubCertKey) }}
{{- $hubKey = index $existing.data (default "hub.key" .Values.controlPlane.tls.hubKeyKey) }}
{{- $agentCrt = index $existing.data (default "agent.crt" .Values.controlPlane.tls.agentCertKey) }}
{{- $agentKey = index $existing.data (default "agent.key" .Values.controlPlane.tls.agentKeyKey) }}
{{- else }}
{{- $ca := genCA (printf "%s-ca" (include "arkflow.fullname" .)) 3650 }}
{{- $hubName := include "arkflow.hubName" . }}
{{- $hubDomains := list $hubName (printf "%s.%s.svc" $hubName .Release.Namespace) (printf "%s.%s.svc.cluster.local" $hubName .Release.Namespace) "localhost" }}
{{- $hubCert := genSignedCert $hubName (list "127.0.0.1") $hubDomains 365 $ca }}
{{- $agentCert := genSignedCert "arkflow-data-plane" nil (list "arkflow-data-plane") 365 $ca }}
{{- $caCrt = $ca.Cert | b64enc }}
{{- $hubCrt = $hubCert.Cert | b64enc }}
{{- $hubKey = $hubCert.Key | b64enc }}
{{- $agentCrt = $agentCert.Cert | b64enc }}
{{- $agentKey = $agentCert.Key | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades and uninstall so a re-install never silently
    # invalidates issued certificates. Delete manually when replacing the CA.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ default "ca.crt" .Values.controlPlane.tls.caKey }}: {{ $caCrt }}
  {{ default "hub.crt" .Values.controlPlane.tls.hubCertKey }}: {{ $hubCrt }}
  {{ default "hub.key" .Values.controlPlane.tls.hubKeyKey }}: {{ $hubKey }}
  {{ default "agent.crt" .Values.controlPlane.tls.agentCertKey }}: {{ $agentCrt }}
  {{ default "agent.key" .Values.controlPlane.tls.agentKeyKey }}: {{ $agentKey }}
{{- end }}
