{{- if eq .Values.mode "control-plane" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arkflow.consoleName" . }}
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
    app.kubernetes.io/component: console
spec:
  replicas: {{ .Values.controlPlane.console.replicaCount }}
  selector:
    matchLabels:
      {{- include "arkflow.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: console
  template:
    metadata:
      labels:
        {{- include "arkflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: console
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ .Values.controlPlane.console.image.repository }}:{{ default .Chart.AppVersion .Values.controlPlane.console.image.tag }}
          imagePullPolicy: {{ .Values.controlPlane.console.image.pullPolicy }}
          env:
            # Same-origin proxy target: the in-chart Hub Service.
            - name: ARKFLOW_HUB_UPSTREAM
              {{- $hubScheme := ternary "https" "http" .Values.controlPlane.tls.enabled }}
              value: {{ printf "%s://%s:8080" $hubScheme (include "arkflow.hubName" .) | quote }}
            {{- if include "arkflow.cpTlsEnabled" . | eq "true" }}
            - name: ARKFLOW_HUB_PROXY_SSL
              value: {{ printf "proxy_ssl_verify on; proxy_ssl_trusted_certificate /etc/arkflow/tls/ca.crt; proxy_ssl_name %s; proxy_ssl_server_name on;" (include "arkflow.hubName" .) | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            {{- toYaml .Values.controlPlane.console.resources | nindent 12 }}
          {{- if include "arkflow.cpTlsEnabled" . | eq "true" }}
          volumeMounts:
            - name: hub-ca
              mountPath: /etc/arkflow/tls
              readOnly: true
          {{- end }}
      {{- if include "arkflow.cpTlsEnabled" . | eq "true" }}
      volumes:
        - name: hub-ca
          secret:
            secretName: {{ include "arkflow.cpTlsSecretName" . }}
            items:
              - key: {{ default "ca.crt" .Values.controlPlane.tls.caKey | quote }}
                path: ca.crt
      {{- end }}
{{- end }}
