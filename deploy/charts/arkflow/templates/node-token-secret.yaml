{{- if and (eq .Values.mode "control-plane") (not .Values.controlPlane.nodeToken.existingSecret) -}}
{{- $secretName := printf "%s-node-token" (include "arkflow.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
{{- $token := randAlphaNum 32 }}
{{- if $existing }}
{{- /* Reuse the live value on upgrade: re-rolling randAlphaNum would rotate
       the shared credential while a running Hub still holds the old token
       (env vars are read at pod start), breaking agent registration. */}}
{{- $token = index $existing.data "node_token" | b64dec }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
  annotations:
    # Kept across upgrades and uninstall so a re-install never silently
    # rotates the shared node credential. Delete manually when certain.
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  node_token: {{ $token | quote }}
{{- end }}
