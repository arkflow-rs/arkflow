{{- if or (ne .Values.mode "control-plane") .Values.controlPlane.agent.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arkflow.workloadName" . }}
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.unsafe.allowMultipleReplicas }}
  # The engine is stateful: two instances consume the same sources twice.
  # Recreate guarantees old and new pods never run concurrently on updates.
  {{- end }}
  replicas: {{ ternary .Values.controlPlane.agent.replicas (include "arkflow.replicas" .) (eq .Values.mode "control-plane") | int }}
  strategy:
    type: Recreate
  # Selector intentionally stays on the original two labels: Deployment
  # selectors are immutable, and releases installed before the component
  # label existed must remain upgradable.
  selector:
    matchLabels:
      {{- include "arkflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the pass-through config document changes.
        checksum/config: {{ .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "arkflow.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: engine
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arkflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: arkflow
          image: {{ include "arkflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/app/etc/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if include "arkflow.agentEnabled" . | eq "true" }}
            - name: data
              containerPort: {{ .Values.agent.dataPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- if include "arkflow.agentEnabled" . | eq "true" }}
            {{- if eq .Values.mode "control-plane" }}
            # In-chart agent: shared generated (or user) node credential.
            - name: ARKFLOW_NODE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "arkflow.nodeTokenSecretName" . }}
                  key: {{ include "arkflow.nodeTokenSecretKey" . }}
            {{- if .Values.agent.nodeId }}
            {{- if not (or .Values.controlPlane.agent.persistence.enabled .Values.controlPlane.agent.persistence.existingClaim) }}
            {{- fail "pinned agent.nodeId in control-plane mode requires controlPlane.agent.persistence.enabled=true or existingClaim so enrolled arkn_ credentials survive Pod replacement" }}
            {{- end }}
            {{- if ne (int .Values.controlPlane.agent.replicas) 1 }}
            {{- fail "pinned agent.nodeId requires controlPlane.agent.replicas=1 so two pods do not contend for one node_id or PVC" }}
            {{- end }}
            - name: ARKFLOW_NODE_CREDENTIAL_FILE
              value: {{ printf "%s/node_credential" (trimSuffix "/" .Values.controlPlane.agent.persistence.mountPath) | quote }}
            {{- else }}
            - name: ARKFLOW_NODE_CREDENTIAL_FILE
              value: "/var/lib/arkflow-agent/node_credential"
            {{- end }}
            {{- else }}
            {{- if .Values.persistence.enabled }}
            - name: ARKFLOW_NODE_CREDENTIAL_FILE
              value: {{ printf "%s/node_credential" (trimSuffix "/" .Values.persistence.mountPath) | quote }}
            {{- else }}
            {{- if .Values.agent.nodeId }}
            {{- fail "pinned agent.nodeId requires persistence.enabled=true so enrolled arkn_ credentials survive Pod replacement" }}
            {{- end }}
            - name: ARKFLOW_NODE_CREDENTIAL_FILE
              value: "/var/lib/arkflow-agent/node_credential"
            {{- end }}
            {{- end }}
            {{- if include "arkflow.agentTlsEnabled" . | eq "true" }}
            {{- $tlsCaKey := ternary (default "ca.crt" .Values.controlPlane.tls.caKey) (default "ca.crt" .Values.agent.tls.caKey) (eq .Values.mode "control-plane") }}
            {{- $tlsCertKey := ternary (default "agent.crt" .Values.controlPlane.tls.agentCertKey) (default "tls.crt" .Values.agent.tls.certKey) (eq .Values.mode "control-plane") }}
            {{- $tlsKeyKey := ternary (default "agent.key" .Values.controlPlane.tls.agentKeyKey) (default "tls.key" .Values.agent.tls.keyKey) (eq .Values.mode "control-plane") }}
            - name: ARKFLOW_AGENT_TLS_CA
              value: {{ printf "/etc/arkflow/tls/%s" $tlsCaKey | quote }}
            - name: ARKFLOW_AGENT_TLS_CERT
              value: {{ printf "/etc/arkflow/tls/%s" $tlsCertKey | quote }}
            - name: ARKFLOW_AGENT_TLS_KEY
              value: {{ printf "/etc/arkflow/tls/%s" $tlsKeyKey | quote }}
            - name: ARKFLOW_DATA_PLANE_TLS_CA
              value: {{ printf "/etc/arkflow/tls/%s" $tlsCaKey | quote }}
            - name: ARKFLOW_DATA_PLANE_TLS_CERT
              value: {{ printf "/etc/arkflow/tls/%s" $tlsCertKey | quote }}
            - name: ARKFLOW_DATA_PLANE_TLS_KEY
              value: {{ printf "/etc/arkflow/tls/%s" $tlsKeyKey | quote }}
            {{- end }}
            {{- if .Values.agent.nodeId }}
            - name: ARKFLOW_NODE_ID
              value: {{ .Values.agent.nodeId | quote }}
            {{- else }}
            # Engine-native fallback (see NodeAgentConfig::from_engine):
            # pod name is the node identity when config sets no node_id.
            - name: ARKFLOW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
            {{- if and (ne .Values.mode "control-plane") .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- else if and (eq .Values.mode "control-plane") .Values.agent.nodeId (or .Values.controlPlane.agent.persistence.enabled .Values.controlPlane.agent.persistence.existingClaim) }}
            - name: agent-data
              mountPath: {{ .Values.controlPlane.agent.persistence.mountPath }}
            {{- else if include "arkflow.agentEnabled" . | eq "true" }}
            - name: agent-credential
              mountPath: /var/lib/arkflow-agent
            {{- end }}
            {{- if include "arkflow.agentTlsEnabled" . | eq "true" }}
            - name: agent-tls
              mountPath: /etc/arkflow/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "arkflow.workloadName" . }}
        {{- if and (ne .Values.mode "control-plane") .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "arkflow.fullname" . }}-data
        {{- else if and (eq .Values.mode "control-plane") .Values.agent.nodeId (or .Values.controlPlane.agent.persistence.enabled .Values.controlPlane.agent.persistence.existingClaim) }}
        - name: agent-data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-agent-data" (include "arkflow.fullname" .)) .Values.controlPlane.agent.persistence.existingClaim }}
        {{- else if include "arkflow.agentEnabled" . | eq "true" }}
        - name: agent-credential
          emptyDir: {}
        {{- end }}
        {{- if include "arkflow.agentTlsEnabled" . | eq "true" }}
        {{- $tlsCaKey := ternary (default "ca.crt" .Values.controlPlane.tls.caKey) (default "ca.crt" .Values.agent.tls.caKey) (eq .Values.mode "control-plane") }}
        {{- $tlsCertKey := ternary (default "agent.crt" .Values.controlPlane.tls.agentCertKey) (default "tls.crt" .Values.agent.tls.certKey) (eq .Values.mode "control-plane") }}
        {{- $tlsKeyKey := ternary (default "agent.key" .Values.controlPlane.tls.agentKeyKey) (default "tls.key" .Values.agent.tls.keyKey) (eq .Values.mode "control-plane") }}
        - name: agent-tls
          secret:
            secretName: {{ include "arkflow.agentTlsSecretName" . }}
            items:
              - key: {{ $tlsCaKey | quote }}
                path: {{ $tlsCaKey | quote }}
              - key: {{ $tlsCertKey | quote }}
                path: {{ $tlsCertKey | quote }}
              - key: {{ $tlsKeyKey | quote }}
                path: {{ $tlsKeyKey | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
