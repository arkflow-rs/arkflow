apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "arkflow.fullname" . }}
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
spec:
  {{- if not .Values.unsafe.allowMultipleReplicas }}
  # The engine is stateful: two instances consume the same sources twice.
  # Recreate guarantees old and new pods never run concurrently on updates.
  {{- end }}
  replicas: {{ include "arkflow.replicas" . }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "arkflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Roll pods when the pass-through config document changes.
        checksum/config: {{ .Values.config | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "arkflow.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "arkflow.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: arkflow
          image: {{ include "arkflow.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["--config", "/app/etc/config.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            {{- if eq .Values.mode "agent" }}
            - name: data
              containerPort: {{ .Values.agent.dataPort }}
              protocol: TCP
            {{- end }}
          env:
            {{- if eq .Values.mode "agent" }}
            # Engine-native fallback (see NodeAgentConfig::from_engine):
            # pod name is the node identity when config sets no node_id.
            - name: ARKFLOW_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /app/etc
              readOnly: true
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: {{ include "arkflow.fullname" . }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "arkflow.fullname" . }}-data
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
