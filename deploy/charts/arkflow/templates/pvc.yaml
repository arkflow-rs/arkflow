{{- if include "arkflow.persistenceEnabled" . | eq "true" -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "arkflow.fullname" . }}-data
  labels:
    {{- include "arkflow.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
