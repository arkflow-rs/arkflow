logging:
  level: info
health_check:
  enabled: true
  address: "127.0.0.1:8080"
  api_prefix: "/api/v1"
streams:
  - id: smoke
    input:
      type: generate
      context: '{"value": 1}'
      interval: 1s
      batch_size: 1
    pipeline:
      thread_num: 1
      processors: []
    output:
      type: stdout
