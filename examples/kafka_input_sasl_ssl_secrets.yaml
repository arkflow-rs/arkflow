# Kafka input over SASL/SSL with secret references — credentials never
# appear in the config file. `${env:VAR:-default}` falls back to the default
# when the variable is unset or empty; `${file:/path}` reads a file instead
# (e.g. a mounted Kubernetes secret). Resolution happens once when the
# config loads; errors name the reference, never the secret value.
logging:
  level: info
streams:
  - input:
      type: kafka
      brokers:
        - broker1.example.com:9094
      topics:
        - events
      consumer_group: arkflow
      start_from_latest: false
      security:
        protocol: sasl_ssl
        sasl:
          mechanism: scram-sha-256
          username: ${env:KAFKA_USERNAME:-arkflow}
          password: ${env:KAFKA_PASSWORD:-change-me}
        tls:
          ca: ${env:KAFKA_CA:-/etc/arkflow/certs/ca.crt}

    pipeline:
      thread_num: 4
      processors:
        - type: json_to_arrow
        - type: sql
          query: "SELECT * FROM flow"
        - type: arrow_to_json

    output:
      type: stdout
