# How-to: CDC via Debezium with Confluent Schema Registry.
#
# Same pipeline as examples/cdc_debezium.yaml, but the Kafka records carry
# Confluent wire-format Protobuf instead of JSON: the `schema_registry`
# codec resolves the schema id from the registry and decodes the payload.
#
# NOTE: the codec maps the payload's top-level fields as declared in the
# registered Protobuf schema — it does NOT flatten the Debezium envelope.
# Nested envelope structs (`source`, `before`) are not supported by the flat
# Arrow mapping, so register a flat schema and select its top-level fields
# (here: op, id, name, ts_ms; assume the topic carries a flat user schema).

logging:
  level: info

streams:
  - id: cdc-schema-registry
    input:
      type: kafka
      brokers:
        - localhost:9092
      topics:
        - shop.users
      consumer_group: arkflow-cdc-sr
      client_id: arkflow-cdc-sr
      start_from_latest: true
      codec:
        type: schema_registry
        registry_url: "http://localhost:8081"
        message_type: "shop.Users"

    pipeline:
      thread_num: 4
      processors:
        - type: sql
          query: |
            SELECT
              op,
              id,
              name,
              ts_ms
            FROM flow

    output:
      type: stdout
