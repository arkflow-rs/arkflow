# S3 WAL — Parallel PUT Example
#
# This example declares parallel PUT workers. NOTE: the knob is currently
# inert — segment seals are serialized for acknowledgement ordering, so the
# worker pool has no production call site and `workers > 1` only logs a
# startup warning ("parallel_put.workers has no effect"). The field is
# accepted for forward compatibility; keep the default 1 and size the WAL
# with segment_tuning and compression instead.
#
# ── See also ────────────────────────────────────────────────────────────
#
#   docs/docs/build/wal.md           (Dimension 2 note)
#   docs/docs/build/delivery-semantics.md
#   docs/docs/develop/s3-wal-performance.md
#   examples/durability_example_aggressive.yaml
#   examples/durability_example_compressed.yaml

logging:
  level: info

streams:
  - input:
      type: "generate"
      context: '{ "value": 10, "sensor": "high_throughput" }'
      interval: 1ns
      batch_size: 500
      count: 1000000

    durability:
      enabled: true
      sync: "group_commit"
      backend:
        type: "object_store"
        node_id: "${ARKFLOW_NODE_ID}"
        stream_id: "parallel-stream"
        prefix: "arkflow/wal"
        s3:
          bucket: "my-bucket"
          region: "us-east-1"
          endpoint: "http://localhost:9000"
          access_key_id: "${AWS_ACCESS_KEY_ID}"
          secret_access_key: "${AWS_SECRET_ACCESS_KEY}"
          allow_http: true

        # ── Parallel PUT Workers ──────────────────────────────────────────
        # Currently inert (seals are serialized; see header comment).
        # Declared here only to document the forward-compatible syntax.
        parallel_put:
          workers: 4              # default 1, max 8 (no effect today)
          shutdown_timeout: "30s" # how long to wait for in-flight uploads

        # Use balanced tuning (default)
        segment_tuning:
          strategy: balanced

    pipeline:
      thread_num: 8
      processors:
        - type: "json_to_arrow"

    output:
      type: "stdout"