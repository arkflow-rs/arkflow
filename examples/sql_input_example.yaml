logging:
  level: info
streams:
  - input:
      type: "sql"
      input_type:
        type: "sqlite"
        name: "flow"
        path: "./data/flow.db"
      select_sql: "SELECT *, value + 999999 AS adjusted_value FROM flow"

    pipeline:
      thread_num: 4
      processors:
        - type: "sql"
          query: "SELECT * FROM flow"

    output:
      type: "stdout"
