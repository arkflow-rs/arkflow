# Left outer stream-stream join example.
#
# The Job DAG join operator matches rows from two sources by an equality key
# when their event timestamps differ by at most `window_ms`. With
# `join_type: left_outer`, matched pairs still emit immediately, and a left
# row that never matched is additionally emitted once the chain watermark
# passes `ts + window_ms + ttl_ms` — with the right-side columns all null
# (and nullable in the output schema). Capacity eviction (`max_per_key`)
# emits unmatched rows too, without a watermark guarantee (at-least-once).
#
# Note: unmatched emission is watermark driven. With constant-timestamp
# generated data the watermark advances only once, so a short local run
# mostly shows matched pairs; the unmatched path is exercised end to end by
# the executor tests (left_outer_join_emits_unmatched_rows_end_to_end).
#
# Validate first (deep checks are the same as startup):
#   ./target/release/arkflow --config examples/job_join_outer.yaml --validate
# Then run:
#   ./target/release/arkflow --config examples/job_join_outer.yaml

streams: []

jobs:
  - id: orders-profiles-outer-join
    version: 1
    parallelism: 1
    max_parallelism: 128

    operators:
      - id: orders
        kind: source
      - id: profiles
        kind: source
      - id: to-json
        kind: map
        config:
          type: arrow_to_json
      - id: join
        kind: join
        config:
          join_type: left_outer
          left_from: orders
          right_from: profiles
          left_key: customer_id
          right_key: customer_id
          left_timestamp: ts
          right_timestamp: ts
          window_ms: 5000
          ttl_ms: 1000
          max_per_key: 10000
      - id: sink
        kind: sink
    edges:
      - id: left-edge
        from: orders
        to: join
        partitioned: false
      - id: right-edge
        from: profiles
        to: join
        partitioned: false
      - id: join-sink
        from: join
        to: to-json
        partitioned: false
      - id: json-sink
        from: to-json
        to: sink
        partitioned: false

    sources:
      # Orders for the enriched customer (c-1). A customer that never
      # appears on the profiles side would surface as an unmatched left row
      # once the watermark closes its match window.
      - operator_id: orders
        input_type: generate
        config:
          type: generate
          context: '{ "customer_id": "c-1", "amount": 42, "ts": 1757000000000 }'
          interval: 500ms
          count: 3
          batch_size: 1
        codec:
          type: json
        time:
          mode: event_time
          timestamp_field: ts
          watermark:
            strategy: bounded_out_of_orderness
            out_of_orderness_ms: 2000
            idle_timeout_ms: 60000
          allowed_lateness_ms: 1000
          late_event_policy: drop
      - operator_id: profiles
        input_type: generate
        config:
          type: generate
          context: '{ "customer_id": "c-1", "tier": "gold", "ts": 1757000000000 }'
          interval: 700ms
          batch_size: 1
        codec:
          type: json
        time:
          mode: event_time
          timestamp_field: ts
          watermark:
            strategy: bounded_out_of_orderness
            out_of_orderness_ms: 2000
            idle_timeout_ms: 60000
          allowed_lateness_ms: 1000
          late_event_policy: drop

    sinks:
      - operator_id: sink
        output_type: stdout
